<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby | Juego multijugador</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/config.js"></script>
    <script src="/common.js"></script>
    <script src="/game.js"></script>
    <style>
        /* Taller 5: el canvas mide el mundo del servidor (800x600) y se escala al ancho disponible */
        #game-canvas { display: block; width: 100%; height: auto; border-radius: 8px; background: #2b2f36; }
        .game-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .game-toolbar p { margin: 0; }
        .color-picker { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .color-picker input { width: 44px; height: 32px; padding: 2px; cursor: pointer; }
        .controls-hint kbd { font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--code); }
    </style>
</head>
<body>
    <main>
        <header class="actions">
            <div>
                <h1>Lobby</h1>
                <p id="current-user" class="muted"></p>
            </div>
            <button id="logout-button" type="button">Cerrar sesión</button>
        </header>

        <p id="connection-status" class="status" aria-live="polite">Conectando con el coordinador…</p>
        <div id="notice" class="message" role="alert" aria-live="assertive"></div>
        <section id="replaced-panel" class="notice-panel" hidden>
            <p>Tu sesión se abrió en otra pestaña.</p>
            <button id="use-here-button" class="primary" type="button">Usar la sesión aquí</button>
        </section>
        <section aria-labelledby="game-heading">
            <h2 id="game-heading">Pista</h2>
            <div class="game-toolbar">
                <p class="muted controls-hint">Muévete con <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>. Tu carro tiene el borde blanco. Insignia: <strong>G</strong> = entró con Google, 🔒 = cuenta local.</p>
                <!-- Taller 5, feature extra replicado: el color viaja en extras_update -->
                <label class="color-picker" for="car-color">Color de tu carro
                    <input id="car-color" type="color" value="#2f6fed">
                </label>
            </div>
            <canvas id="game-canvas" width="800" height="600" aria-label="Pista del juego con los carros de todos los jugadores"></canvas>
        </section>
        <section aria-labelledby="players-heading">
            <h2 id="players-heading">Jugadores en línea <span id="player-count">(0)</span></h2>
            <ul id="players-list" class="players"></ul>
        </section>
    </main>

    <script>
        const token = getToken();
        if (!token) {
            window.location.replace("/login.html");
        } else {
            let intentionalClose = false;
            let currentUserId = null;
            let socket;
            let activeToken = token;
            let lastVerifiedTokenCandidate = null;
            let verifySecurityTimer = null;
            let pollTimer = null;
            let heartbeatTimer = null;
            let activeExpirationTimer = null;
            let lastErrorMessage = "";
            let tokenPayload = decodeToken(token);
            let lastKnownExpiresIn = null;
            let policyChangeTimestamp = null;

            const currentUser = document.getElementById("current-user");
            const connectionStatus = document.getElementById("connection-status");
            const notice = document.getElementById("notice");
            const replacedPanel = document.getElementById("replaced-panel");
            const playersList = document.getElementById("players-list");
            const playerCount = document.getElementById("player-count");

            currentUser.textContent = `Usuario: ${localStorage.getItem("username") || "desconocido"}`;

            // ── Taller 5, feature extra: color del carro replicado ─────────────────
            // El cliente manda extras_update { color }; el coordinador lo guarda en
            // player.extras y lo reparte a todos en el próximo state. Dura toda la sesión.
            // Además lo guardamos en localStorage para reenviarlo si recargas la página.
            const colorInput = document.getElementById("car-color");
            let colorSendTimer = null;

            function sendColor(color) {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "extras_update", extras: { color } }));
                }
            }

            function setupColorPicker(userId) {
                const saved = localStorage.getItem(`carColor:${userId}`);
                colorInput.value = saved || defaultCarColor(userId);
                colorInput.dataset.userId = userId;
                if (saved) sendColor(saved); // reponer el color elegido antes
            }

            // Mientras se arrastra el selector llegan muchos "input": mandamos máx. 1 cada 150 ms
            colorInput.addEventListener("input", () => {
                if (colorSendTimer) return;
                colorSendTimer = setTimeout(() => {
                    colorSendTimer = null;
                    sendColor(colorInput.value);
                }, 150);
            });

            colorInput.addEventListener("change", () => {
                sendColor(colorInput.value);
                if (colorInput.dataset.userId) {
                    localStorage.setItem(`carColor:${colorInput.dataset.userId}`, colorInput.value);
                }
                colorInput.blur(); // devolver el teclado al juego
            });

            // Taller 5: el juego solo envía intenciones; dibuja lo que manda el servidor
            const game = createGame({
                canvas: document.getElementById("game-canvas"),
                send: (payload) => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify(payload));
                    }
                }
            });

            function showNotice(message, hint = "") {
                notice.replaceChildren();
                const messageLine = document.createElement("p");
                messageLine.textContent = message;
                notice.append(messageLine);
                if (hint) {
                    const hintLine = document.createElement("p");
                    hintLine.textContent = `Sugerencia: ${hint}`;
                    notice.append(hintLine);
                }
                notice.classList.add("error");
            }

            function renderPlayers(players) {
                playersList.replaceChildren();
                playerCount.textContent = `(${players.length})`;
                for (const player of players) {
                    const item = document.createElement("li");
                    item.textContent = player.username;
                    if (
                        (currentUserId && player.userId === currentUserId) ||
                        (!currentUserId && player.username === localStorage.getItem("username"))
                    ) {
                        item.classList.add("current");
                    }
                    playersList.append(item);
                }
            }

            function decodeToken(tok) {
                try {
                    const parts = tok.split('.');
                    if (parts.length < 2) return null;
                    const base64Url = parts[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch {
                    return null;
                }
            }

            function parseDurationToSeconds(val) {
                if (!val) return 3600;
                if (typeof val === 'number') return val;
                val = String(val).trim();
                if (/^\d+$/.test(val)) return Number(val);
                const match = val.match(/^(\d+)([smhdw]?)$/i);
                if (!match) return 3600;
                const num = Number(match[1]);
                const unit = (match[2] || 's').toLowerCase();
                switch (unit) {
                    case 's': return num;
                    case 'm': return num * 60;
                    case 'h': return num * 3600;
                    case 'd': return num * 86400;
                    case 'w': return num * 604800;
                    default: return num;
                }
            }

            async function checkActiveExpiration() {
                if (intentionalClose) return;
                try {
                    const { AUTH_URL } = getAppConfig();
                    const res = await fetch(`${AUTH_URL}/health`, {
                        headers: { 'ngrok-skip-browser-warning': 'true' }
                    });
                    const data = await res.json();
                    if (data && data.jwtExpiresIn) {
                        const currentExpiresStr = String(data.jwtExpiresIn).trim();
                        const allowedSeconds = parseDurationToSeconds(currentExpiresStr);

                        // Inicializar el valor al momento de entrar al lobby
                        if (lastKnownExpiresIn === null) {
                            lastKnownExpiresIn = currentExpiresStr;
                        } else if (lastKnownExpiresIn !== currentExpiresStr) {
                            // Se detectó cambio en .env: reiniciar cronómetro desde cero a partir de este momento
                            lastKnownExpiresIn = currentExpiresStr;
                            policyChangeTimestamp = Math.floor(Date.now() / 1000);
                            console.log(`[Lobby] Cambio en .env detectado: ${currentExpiresStr}. Conteo de ${allowedSeconds}s iniciado desde ahora.`);
                        }

                        // Si hubo cambio a una política en caliente, esperar que transcurra el nuevo tiempo desde el cambio
                        if (policyChangeTimestamp !== null && allowedSeconds > 0) {
                            const secondsSinceChange = Math.floor(Date.now() / 1000) - policyChangeTimestamp;
                            if (secondsSinceChange >= allowedSeconds) {
                                if (socket && socket.readyState === WebSocket.OPEN) {
                                    socket.send(JSON.stringify({
                                        type: 'verify',
                                        token: getToken(),
                                        forceExpired: true
                                    }));
                                }
                                setTimeout(() => {
                                    returnToLogin("Tu sesión expiró.");
                                }, 600);
                            }
                        }
                    }
                } catch {
                    // Fallo transitorio de red no interrumpe el watcher
                }
            }

            function stopSessionWatcher() {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
                if (heartbeatTimer) {
                    clearInterval(heartbeatTimer);
                    heartbeatTimer = null;
                }
                if (activeExpirationTimer) {
                    clearInterval(activeExpirationTimer);
                    activeExpirationTimer = null;
                }
                if (verifySecurityTimer) {
                    clearTimeout(verifySecurityTimer);
                    verifySecurityTimer = null;
                }
                window.removeEventListener("storage", handleStorageEvent);
            }

            function returnToLogin(message) {
                stopSessionWatcher();
                clearCredentials();
                sessionStorage.setItem("loginNotice", message);
                window.location.replace("/login.html");
            }

            function checkTokenStatus() {
                if (intentionalClose) return;
                const current = getToken();

                // Token eliminado (null) -> cierre de sesión local inmediato
                if (current === null) {
                    stopSessionWatcher();
                    intentionalClose = true;
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.close(1000, "logout");
                    }
                    returnToLogin("La sesión se cerró porque se eliminó el token.");
                    return;
                }

                // Token modificado / ensuciado -> enviar verify de inmediato
                if (current !== activeToken) {
                    lastVerifiedTokenCandidate = current;
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: "verify", token: current }));
                        if (!verifySecurityTimer) {
                            verifySecurityTimer = setTimeout(() => {
                                returnToLogin("El coordinador no respondió a la verificación del token.");
                            }, 2000);
                        }
                    } else if (socket && socket.readyState !== WebSocket.CONNECTING) {
                        returnToLogin("Se perdió la conexión al intentar verificar el token.");
                    }
                }
            }

            function handleStorageEvent(event) {
                if (event.key === "token" || event.key === null) {
                    checkTokenStatus();
                }
            }

            function startSessionWatcher(ws, initialToken) {
                activeToken = initialToken;
                stopSessionWatcher();

                // Sondeo cada ~300 ms (mecanismo principal para cambios en DevTools)
                pollTimer = setInterval(checkTokenStatus, 300);

                // Latido secundario cada ~5 s como defensa adicional
                heartbeatTimer = setInterval(() => {
                    if (intentionalClose) return;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const cur = getToken();
                        if (cur) {
                            ws.send(JSON.stringify({ type: "verify", token: cur }));
                        }
                    }
                }, 5000);

                // Comprobación activa de expiración del .env cada 1.5 s para sesiones ya abiertas
                activeExpirationTimer = setInterval(checkActiveExpiration, 1500);

                // Escucha de evento storage (cambios desde otras pestañas, p. ej. logout)
                window.addEventListener("storage", handleStorageEvent);
            }

            document.getElementById("logout-button").addEventListener("click", () => {
                intentionalClose = true;
                stopSessionWatcher();
                clearCredentials();
                if (socket) {
                    socket.close(1000, "logout");
                }
                window.location.replace("/login.html");
            });

            document.getElementById("use-here-button").addEventListener("click", () => {
                window.location.reload();
            });

            try {
                const { COORDINATOR_WS_URL } = getAppConfig();
                socket = new WebSocket(
                    `${COORDINATOR_WS_URL}/connect?token=${encodeURIComponent(token)}`
                );

                socket.addEventListener("open", () => {
                    connectionStatus.textContent = "Conectado al coordinador.";
                    startSessionWatcher(socket, token);
                });

                socket.addEventListener("message", (event) => {
                    let msg;
                    try {
                        msg = JSON.parse(event.data);
                    } catch {
                        showNotice("El coordinador envió una respuesta que no se pudo interpretar.");
                        return;
                    }

                    switch (msg.type) {
                        case "connected":
                            currentUserId = msg.userId;
                            currentUser.textContent = `Conectado como ${msg.username}.`;
                            connectionStatus.textContent = "Conectado al coordinador.";
                            break;
                        case "welcome":
                            game.onWelcome(msg);
                            setupColorPicker(msg.you.userId);
                            break;
                        case "state":
                            game.onState(msg);
                            break;
                        case "players_update":
                            if (Array.isArray(msg.players)) {
                                renderPlayers(msg.players);
                            }
                            break;
                        case "verified":
                            if (verifySecurityTimer) {
                                clearTimeout(verifySecurityTimer);
                                verifySecurityTimer = null;
                            }
                            if (lastVerifiedTokenCandidate) {
                                activeToken = lastVerifiedTokenCandidate;
                                lastVerifiedTokenCandidate = null;
                            }
                            break;
                        case "error":
                            lastErrorMessage = msg.message;
                            if (msg.code === "TOKEN_MISMATCH") {
                                lastErrorMessage = "El token no corresponde a esta sesión.";
                            }
                            showNotice(msg.message, msg.hint);
                            break;
                        case "pong":
                            break;
                    }
                });

                socket.addEventListener("close", (event) => {
                    stopSessionWatcher();
                    game.stop(); // deja de leer el teclado
                    if (intentionalClose) {
                        return;
                    }
                    if (event.code === 4002) {
                        connectionStatus.textContent = "Sesión reemplazada.";
                        showNotice("Tu sesión se abrió en otra pestaña.");
                        replacedPanel.hidden = false;
                        return;
                    }
                    if (event.code === 4001) {
                        returnToLogin(lastErrorMessage || "Tu sesión no es válida o venció.");
                        return;
                    }
                    if (event.code === 4003) {
                        returnToLogin("Tu sesión expiró.");
                        return;
                    }
                    returnToLogin("Se perdió la conexión con el coordinador.");
                });

                socket.addEventListener("error", () => {
                    connectionStatus.textContent = "No fue posible mantener la conexión con el coordinador.";
                });
            } catch {
                returnToLogin("No se pudo cargar la configuración del coordinador.");
            }
        }
    </script>
</body>
</html>
