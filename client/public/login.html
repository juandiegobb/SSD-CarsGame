<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | SSD Cars Multijugador</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/config.js"></script>
    <script src="/common.js"></script>
    <!-- Three.js (r128) para la animación 3D del bólido arcade -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Identity Services (botón oficial "Sign in with Google") -->
    <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body class="auth-page arcade-theme">
    <main class="login-wrapper login-split-layout">
        <!-- Columna Izquierda: Animación 3D limpia y minimalista del Carro -->
        <section class="login-left-showcase" aria-label="Animación 3D del bólido">
            <div id="threejs-canvas-container" class="showcase-canvas-container" aria-hidden="true"></div>
        </section>

        <!-- Columna Derecha: Panel de Acceso y Autenticación -->
        <section class="login-right-auth" aria-label="Panel de inicio de sesión">
            <header class="game-hero">
                <div class="hero-badge" aria-hidden="true">🏁</div>
                <div class="hero-text">
                    <span class="hero-kicker">Campeonato Multijugador</span>
                    <h1>SSD Cars</h1>
                    <p class="muted">Elige tu piloto, personaliza tu carro y entra a la pista.</p>
                </div>
            </header>

            <!-- Mensajes y avisos del servidor -->
            <p id="login-notice" class="message" role="alert"></p>
            <p id="auth-message" class="message" role="alert" aria-live="polite"></p>

            <!-- Tarjeta principal de acceso -->
            <div class="auth-card holographic-card">
                <!-- Pestañas de alternancia Iniciar Sesión / Registrarse -->
                <div class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
                    <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true" aria-controls="login-section">
                        Iniciar sesión
                    </button>
                    <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false" aria-controls="register-section">
                        Crear cuenta
                    </button>
                </div>

                <!-- Panel: Iniciar Sesión -->
                <section id="login-section" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
                    <form id="login-form">
                        <label for="login-username">
                            <span>Nombre de usuario</span>
                            <input id="login-username" name="username" autocomplete="username" placeholder="Ej. piloto_veloz" required>
                        </label>
                        <label for="login-password">
                            <span>Contraseña</span>
                            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                        </label>
                        <button class="primary auth-submit-btn" type="submit">Entrar a la pista</button>
                    </form>
                </section>

                <!-- Panel: Registro -->
                <section id="register-section" class="auth-panel" role="tabpanel" aria-labelledby="tab-register" hidden>
                    <form id="register-form">
                        <label for="register-username">
                            <span>Nombre de usuario</span>
                            <input id="register-username" name="username" autocomplete="username" placeholder="Elige tu alias de corredor" required>
                        </label>
                        <label for="register-password">
                            <span>Contraseña</span>
                            <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 4 caracteres" required>
                        </label>
                        <button class="primary auth-submit-btn" type="submit">Registrarme</button>
                    </form>
                </section>

                <!-- Separador estético -->
                <div class="auth-divider">
                    <span>o ingresa con</span>
                </div>

                <!-- Sección Google Sign-In -->
                <section id="google-section" class="google-auth-box">
                    <p id="google-message" class="message" role="alert" aria-live="polite"></p>
                    <div id="google-button"></div>
                    <p id="google-unavailable" class="muted" hidden></p>

                    <!-- Solo aparece el primer ingreso con Google (409 USERNAME_REQUIRED) -->
                    <form id="google-username-form" hidden>
                        <p class="google-hint">Es tu primer ingreso con Google. Elige el nombre con el que te verán los demás corredores:</p>
                        <label for="google-username">
                            <span>Nombre de piloto</span>
                            <input id="google-username" name="username" autocomplete="username" placeholder="Tu alias en el juego" required>
                        </label>
                        <div class="button-row">
                            <button class="primary" type="submit">Confirmar y entrar</button>
                            <button id="google-cancel" type="button">Cancelar</button>
                        </div>
                    </form>
                </section>
            </div>

            <p id="lobby-link" hidden><a href="/lobby.html" class="lobby-back-link">← Continuar al lobby</a></p>
        </section>
    </main>

    <!-- Script de Inicialización de Three.js 3D -->
    <script src="/login-3d.js"></script>

    <script>
        // ── Pestañas de interfaz (Login vs Registro) ──────────────────────────
        const tabLogin = document.getElementById("tab-login");
        const tabRegister = document.getElementById("tab-register");
        const loginSection = document.getElementById("login-section");
        const registerSection = document.getElementById("register-section");

        if (tabLogin && tabRegister) {
            tabLogin.addEventListener("click", () => {
                tabLogin.classList.add("active");
                tabLogin.setAttribute("aria-selected", "true");
                tabRegister.classList.remove("active");
                tabRegister.setAttribute("aria-selected", "false");
                loginSection.hidden = false;
                registerSection.hidden = true;
            });

            tabRegister.addEventListener("click", () => {
                tabRegister.classList.add("active");
                tabRegister.setAttribute("aria-selected", "true");
                tabLogin.classList.remove("active");
                tabLogin.setAttribute("aria-selected", "false");
                registerSection.hidden = false;
                loginSection.hidden = true;
            });
        }

        // ── Lógica Funcional Existente (Preservada al 100%) ────────────────────
        const authMessage = document.getElementById("auth-message");
        const loginNotice = document.getElementById("login-notice");
        const genericAuthError = "No pudimos conectar con el servicio de ingreso. Revisa tu conexión e inténtalo de nuevo.";

        function showAuthMessage(message, hint = "", isError = false) {
            authMessage.replaceChildren();
            const messageLine = document.createElement("p");
            messageLine.textContent = message;
            authMessage.append(messageLine);
            if (hint) {
                const hintLine = document.createElement("p");
                hintLine.textContent = `Sugerencia: ${hint}`;
                authMessage.append(hintLine);
            }
            authMessage.className = `message ${isError ? "error" : "success"}`;
        }

        const notice = sessionStorage.getItem("loginNotice");
        if (notice) {
            loginNotice.textContent = notice;
            loginNotice.classList.add("error");
            sessionStorage.removeItem("loginNotice");
        }
        document.getElementById("lobby-link").hidden = !getToken();

        document.getElementById("register-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = new FormData(event.currentTarget);
            const result = await apiPost("/register", {
                username: form.get("username"),
                password: form.get("password")
            });
            if (!result.valid) {
                showAuthMessage(genericAuthError, "", true);
                return;
            }
            if (result.ok) {
                const feedback = friendlyFeedback(result.payload);
                showAuthMessage(feedback.message || "Cuenta creada. Ya puedes iniciar sesión.", feedback.hint);
                document.getElementById("register-form").reset();
                if (tabLogin) tabLogin.click();
                return;
            }
            const feedback = friendlyFeedback(result.payload);
            showAuthMessage(feedback.message, feedback.hint, true);
        });

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = new FormData(event.currentTarget);
            const result = await apiPost("/login", {
                username: form.get("username"),
                password: form.get("password")
            });
            if (!result.valid) {
                showAuthMessage(genericAuthError, "", true);
                return;
            }
            if (!result.ok) {
                const feedback = friendlyFeedback(result.payload);
                showAuthMessage(feedback.message, feedback.hint, true);
                return;
            }
            if (
                typeof result.payload.token !== "string" ||
                typeof result.payload.username !== "string" ||
                !result.payload.token ||
                !result.payload.username
            ) {
                showAuthMessage(genericAuthError, "", true);
                return;
            }
            setCredentials(result.payload.token, result.payload.username);
            window.location.assign("/lobby.html");
        });

        // ── Taller 5: Login con Google (Google Identity Services) ─────────────
        const googleButton = document.getElementById("google-button");
        const googleUnavailable = document.getElementById("google-unavailable");
        const googleUsernameForm = document.getElementById("google-username-form");
        const googleMessage = document.getElementById("google-message");
        let pendingIdToken = null;

        function showGoogleMessage(message, hint = "", isError = false) {
            googleMessage.replaceChildren();
            const messageLine = document.createElement("p");
            messageLine.textContent = message;
            googleMessage.append(messageLine);
            if (hint) {
                const hintLine = document.createElement("p");
                hintLine.textContent = `Sugerencia: ${hint}`;
                googleMessage.append(hintLine);
            }
            googleMessage.className = `message ${isError ? "error" : "success"}`;
        }

        function clearGoogleMessage() {
            googleMessage.replaceChildren();
            googleMessage.className = "message";
        }

        async function sendGoogleLogin(idToken, username) {
            const body = username ? { idToken, username } : { idToken };
            const result = await apiPost("/auth/google", body);
            if (!result.valid) {
                showGoogleMessage(genericAuthError, "", true);
                return;
            }
            if (result.ok) {
                pendingIdToken = null;
                setCredentials(result.payload.token, result.payload.username);
                window.location.assign("/lobby.html");
                return;
            }
            if (result.payload.code === "USERNAME_REQUIRED") {
                pendingIdToken = idToken;
                googleUsernameForm.hidden = false;
                googleButton.hidden = true;
                clearGoogleMessage();
                document.getElementById("google-username").focus();
                return;
            }
            if (result.payload.code === "INVALID_ID_TOKEN") {
                resetGoogleForm();
            }
            const feedback = friendlyFeedback(result.payload);
            showGoogleMessage(feedback.message, feedback.hint, true);
        }

        function resetGoogleForm() {
            pendingIdToken = null;
            googleUsernameForm.reset();
            googleUsernameForm.hidden = true;
            googleButton.hidden = false;
        }

        googleUsernameForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!pendingIdToken) {
                resetGoogleForm();
                return;
            }
            const username = new FormData(googleUsernameForm).get("username");
            sendGoogleLogin(pendingIdToken, username);
        });

        document.getElementById("google-cancel").addEventListener("click", () => {
            resetGoogleForm();
            clearGoogleMessage();
        });

        function showGoogleUnavailable(text) {
            googleUnavailable.textContent = text;
            googleUnavailable.hidden = false;
        }

        function initGoogleLogin() {
            const clientId = window.APP_CONFIG && window.APP_CONFIG.GOOGLE_CLIENT_ID;
            if (!clientId) {
                showGoogleUnavailable("El acceso con Google no está disponible en este momento.");
                return;
            }
            if (!window.google || !google.accounts || !google.accounts.id) {
                showGoogleUnavailable("No se pudo cargar el botón de Google. Revisa tu conexión a internet.");
                return;
            }
            google.accounts.id.initialize({
                client_id: clientId,
                callback: (response) => sendGoogleLogin(response.credential)
            });
            google.accounts.id.renderButton(googleButton, {
                theme: "outline",
                size: "large",
                text: "signin_with",
                locale: "es"
            });
        }

        window.addEventListener("load", initGoogleLogin);
    </script>
</body>
</html>
